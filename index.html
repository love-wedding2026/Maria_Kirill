<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Приглашение</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Блок 1 -->
  <section class="block-1 fade-in">
    <img src="img/1.png" alt="Фото 1" class="block-1-img">
  </section>

  <!-- Блок 2 -->
<section class="block-2 fade-in">
  <img src="img/2.png" alt="Музыка" class="music-btn" id="musicBtn">
  
  <audio id="audio" src="detskaja-govorjat-my-bjaki-buki.mp3"></audio>
</section>

  <!-- Блок 3 -->
  <section class="block-3 fade-in">
    <img src="img/3.png" alt="Фото 3" class="block-3-img">
  </section>

    <!-- Блок 4 -->
  <section class="block-4 fade-in">
    <img src="img/4.png" alt="Фото 4" class="block-4-img">
  </section>

  <!-- Блок 5 -->
<section class="block-5 fade-in">
  
  <img src="img/5.png" alt="Фото 5" class="block-5-img">

  <a href="https://yandex.ru/navi/org/staraya_melnitsa/205903056207?si=1575fvvgv8g52xf171btf9bck4" target="_blank">
    <img src="img/6.png" alt="Карта" class="block-5-img">
  </a>

</section>

  <!-- Блок 6 -->
  <section class="block-6 fade-in">
    <img src="img/7.png" alt="Фото 7" class="block-6-img">
  </section>

    <!-- Блок 7 -->
  <section class="block-7 fade-in">
    <img src="img/8.png" alt="Фото 8" class="block-7-img">
  </section>

  <!-- Блок 8 -->
<section class="block-8 fade-in">

  <h2 class="block-8-title">Анкета</h2>

 <form id="form8" class="form-8">

  <input type="hidden" name="_captcha" value="false">

  <input 
    type="text" 
    name="ФИО" 
    placeholder="Ваше ФИО" 
    class="input-8"
    required
  >

  <p class="text-8">Подтвердите свое присутствие</p>

  <label class="radio-8">
    <input type="radio" name="Присутствие" value="Да, я с радостью приду" required>
    Да, я с радостью приду
  </label>

  <label class="radio-8">
    <input type="radio" name="Присутствие" value="Не смогу">
    К сожалению, не смогу присутствовать
  </label>

  <p class="text-8">Планируете ли вы быть с гостем (+1)?</p>

  <label class="radio-8">
    <input type="radio" name="+1" value="Да" required>
    Да
  </label>

  <label class="radio-8">
    <input type="radio" name="+1" value="Нет">
    Нет
  </label>

  <button type="submit" class="submit-btn">
    <img src="img/9.png" alt="">
  </button>

</form>

</section>

  <!-- Блок 9 -->
  <section class="block-9 fade-in">
    <img src="img/10.png" alt="Фото 10" class="block-9-img">
  </section>

  <script src="script.js"></script>
</body>
</html>
